name: Sync NEPSE holidays

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Fetch the NEPSE holiday listing
        run: node scripts/sync-holidays.mjs

      - name: Commit changed holiday data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add holidays.json
          if git diff --cached --quiet; then
            echo "Holiday calendar unchanged."
            exit 0
          fi
          git commit -m "chore: sync NEPSE holiday calendar"
          git push
